      - "Verify your phone number when asked — it is required to create keys and is not available in every country (if yours is missing, write to help@build.nvidia.com)."
      - "Create an API key at [build.nvidia.com/settings/api-keys](https://build.nvidia.com/settings/api-keys). It starts with nvapi-."
      - "Paste it below."
    signup_note: >-
      A free NVIDIA Developer account with phone verification. Verification is
      not available in every country (it worked with a Spanish number); NVIDIA
      asks users who cannot verify to write to help@build.nvidia.com.
    signup_source_url: https://forums.developer.nvidia.com/t/cannot-verify-phone-country-not-in-dropdown/374813
    hosting_note: "Served by NVIDIA. Free endpoints are for development and testing, not production."
    data_policy_summary: >-
      For development and testing only, per NVIDIA's API trial terms. NVIDIA
      records inputs and outputs to provide the trial and to improve its
      products and services, including AI models.
    data_policy_details: >-
      NVIDIA API Trial Terms of Service: access is "for limited trial purposes
      only and without use of the API Service or Generated Content in
      production"; NVIDIA collects user content and generated content "to
      improve NVIDIA products and services, including AI models". Each model
      card repeats that input and output are recorded for the trial and to
      improve NVIDIA products. Free endpoints get deprecated over time.
    data_policy_url: https://assets.ngc.nvidia.com/products/api-catalog/legal/NVIDIA%20API%20Trial%20Terms%20of%20Service.pdf
    account_limits: {rpm: 40, rpd: 10000, verified: official,
                     source_url: https://build.nvidia.com/z-ai/glm-5-3, last_verified: 2026-10-14,
                     note: "\"Up to 40 rpm\" and \"10,000 requests per day\" on each model card; may vary by model and traffic."}
    last_verified: 2026-10-14
    source_url: https://build.nvidia.com/models
    models:                      # the allowlist, validated against /v1/models at launch;
                                 # ordered by measured speed on a 4-tool question (2026-10-14)
      - id: nvidia/nemotron-3-super-120b-a12b
        label: "Nemotron 3 Super (NVIDIA)"
        context_window: 1000000
        tools: true
        card_url: https://build.nvidia.com/nvidia/nemotron-3-super-120b-a12b
        note: "NVIDIA's own; 120B MoE, 12B active. Measured 2026-10-14: a 4-tool question in 56 s (calls 2–14 s)."
        thinking:                # from the model card: chat_template_kwargs.enable_thinking
          "off": {chat_template_kwargs: {enable_thinking: false}}
          "on": {chat_template_kwargs: {enable_thinking: true}}
      - id: nvidia/nemotron-3-ultra-550b-a55b
        label: "Nemotron 3 Ultra (NVIDIA)"
        context_window: 1000000
        tools: true
        card_url: https://build.nvidia.com/nvidia/nemotron-3-ultra-550b-a55b
        note: "NVIDIA's own; 550B MoE, 55B active. Measured 2026-10-14: a 4-tool question in 88 s."
        thinking:                # from the model card: enable_thinking, medium_effort
          "off": {chat_template_kwargs: {enable_thinking: false}}
