  - id: openrouter_free
    display_name: "OpenRouter · free models"
    tier: free
    provider: openrouter
    tier_env: {OPENROUTER_TIER: free}
    api_style: openai_chat
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    model_env: OPENROUTER_MODEL
    key_url: https://openrouter.ai/settings/keys
    discovery: openrouter
    discovery_url: https://openrouter.ai/api/v1/models
    privacy_settings_url: https://openrouter.ai/settings/privacy
    guardrails_url: https://openrouter.ai/docs/guides/features/guardrails
    thinking_values: [none, low, medium, high]     # OpenRouter's reasoning.effort; sent only to models that support it
    thinking_doc_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
    fallbacks_doc_url: https://openrouter.ai/docs/guides/routing/model-fallbacks
    data_collection_doc_url: https://openrouter.ai/docs/guides/routing/provider-selection
    setup_steps:
      - "Create an account at [openrouter.ai](https://openrouter.ai) — no card is needed for free models."
      - "Create an API key at [openrouter.ai/settings/keys](https://openrouter.ai/settings/keys)."
      - "Optional: choose which providers may use your prompts at [openrouter.ai/settings/privacy](https://openrouter.ai/settings/privacy)."
      - "Paste the key below."
    signup_note: "An OpenRouter account; no card needed for free models."
    hosting_note: "A router: each free model is served by its own provider, with its own data policy."
    data_policy_summary: >-
      OpenRouter does not store prompts unless you opt in, but each model's
      provider has its own policy, and free-model hosts may store prompts and
      train on them. CONDUCTOR allows them by default, because excluding them
      currently leaves no free model working.
    data_policy_details: >-
      OpenRouter's privacy settings have separate switches for paid and free
      models, including whether to allow providers that may train on your data
      or free endpoints that publish prompts. CONDUCTOR can also ask, per
      request, for providers that do not collect data (provider routing
      "data_collection": "deny"; "Exclude providers that collect data" in the
      settings). When tested on 14 October 2026 that left no free model with an
      allowed provider ("No endpoints found matching your data policy"), so it
      is off by default. OpenRouter's Guardrails can restrict a key to
      specific models and block endpoints that train on or retain data. No
      current free text model is on OpenRouter's zero-data-retention list. The
      data-use warning on a model is a keyword heuristic on its description: no
      warning does not mean a model is private.
    data_policy_url: https://openrouter.ai/docs/guides/privacy/provider-logging
    account_limits: {rpm: 20, rpd: 50, rpd_with_credit: 1000, credit_threshold_usd: 10, verified: official,
                     source_url: https://openrouter.ai/docs/api_reference/limits, last_verified: 2026-10-14,
                     note: "1,000 requests/day once $10 of credit has ever been bought; no published TPM."}
    last_verified: 2026-10-14
    source_url: https://openrouter.ai/docs/api_reference/limits

