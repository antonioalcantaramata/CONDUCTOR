        context_window: 1000000
        tools: true
        card_url: https://build.nvidia.com/nvidia/nemotron-3.5-lightning-30b-a3b
        note: "NVIDIA's own; 30B MoE, 3B active. Measured 2026-10-14: a 4-tool question in 83 s."
        thinking:                # from the model card: chat_template_kwargs.enable_thinking
          "off": {chat_template_kwargs: {enable_thinking: false}}
          "on": {chat_template_kwargs: {enable_thinking: true}}

      - id: z-ai/glm-5.3
        label: "GLM 5.3 (Z.ai)"
        context_window: 1048576
        tools: true
        card_url: https://build.nvidia.com/z-ai/glm-5-3
        note: "753B MoE, ~40B active. Measured 2026-10-14: a 4-tool question in 657 s (one timeout); slow on the free endpoint."
        thinking:                # from the model card: reasoning_effort low | high | max (default max)
