# CONDUCTOR provider catalog — the single source of truth for every LLM option
# the launch screen offers: tiers, limits, links and data-use notes.
#
# Data only. The UI reads everything from here (agent/catalog.py validates it on
# load) and never hard-codes a limit, a URL or a policy sentence.
#
# Every number carries where it came from:
#   source_url     the page it was read from
#   verified       official   — stated by the provider's own docs or model card
#                  third_party — reported elsewhere, not on an official page
#                  unverified — not found in official docs (e.g. shown only in a
#                               console); keep, but say so
#   last_verified  the date it was last checked
# `null` means not published / unknown — the UI says "not published".
#
# Limits change often. Re-check the sources and update `last_verified`.

schema_version: 1

defaults:
  calls_per_question: 4          # until this machine has measured its own average
  overhead_tokens_fallback: 28000

tiers:
  free: {label: "Free", caption: "Hosted, no cost. Rate-limited; for testing with sample networks."}
  paid: {label: "Paid", caption: "Hosted, paid per token. Limits depend on your plan."}
  local: {label: "Local", caption: "Runs on this machine. No grid data leaves it."}

# Shown on every free and free-trial card.
free_tier_notice: >-
  Free tiers are meant for testing with sample networks such as the
  bundled IEEE case. For real or confidential grid data, use Local (Ollama) or a
  paid tier whose terms fit your organisation.

options:

  # ── Free ────────────────────────────────────────────────────────────────────

  - id: gemini_free
    display_name: "Gemini API · free tier"
    tier: free
    recommended: true
    provider: google
    tier_env: {GEMINI_TIER: free}
    api_style: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GEMINI_API_KEY
    model_env: GEMINI_MODEL
    key_url: https://aistudio.google.com/app/apikey
    discovery: static
    default_model: gemini-3.5-flash-lite
    fallback_chain: [gemini-3.5-flash-lite, gemini-3.1-flash-lite]
    fallback_env: GEMINI_FALLBACK_MODELS
    reset_note: "Daily quotas reset at midnight Pacific time."
    reset_source_url: https://ai.google.dev/gemini-api/docs/rate-limits
    setup_steps:
      - "Go to [aistudio.google.com](https://aistudio.google.com/app/apikey) and sign in with any Google account — no payment needed for the free tier."
      - "Click Get API key, then Create API key, and copy it."
      - "Paste it below."
    signup_note: "A Google account; the key is created in Google AI Studio."
    hosting_note: "Google. Users in the EEA, Switzerland or the UK get paid-tier data handling even on the free tier."
    data_policy_summary: >-
      Google may use free-tier prompts and responses to improve its products,
      and human reviewers may read them. In the EEA, Switzerland and the UK the
      paid-tier data terms apply instead (no use for product improvement).
    data_policy_details: >-
      Gemini API Additional Terms, "Unpaid Services": Google uses the content
      you submit and the responses to provide, improve and develop its products;
      human reviewers may read, annotate and process API input and output; do
      not submit sensitive, confidential or personal information. If you are in
      the European Economic Area, Switzerland or the United Kingdom, the "Paid
      Services" data terms apply to all services, including unpaid quota: prompts
      and responses are logged for a limited period only to detect abuse.
      Grounding with Google Search (not used by CONDUCTOR) stores prompts for
      30 days.
    data_policy_url: https://ai.google.dev/gemini-api/terms
    last_verified: 2026-10-14
    source_url: https://ai.google.dev/gemini-api/docs/models
    models:
      - id: gemini-3.5-flash-lite
        label: "Gemini 3.5 Flash-Lite"
        context_window: 1048576
        tools: true
