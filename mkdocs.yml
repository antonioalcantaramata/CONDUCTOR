# The documentation site, published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally:  pip install -r docs/requirements.txt && mkdocs serve
site_name: CONDUCTOR
site_description: A solver-grounded AI assistant for distribution grids — user guide and reference
site_url: https://antonioalcantaramata.github.io/CONDUCTOR/
repo_url: https://github.com/antonioalcantaramata/CONDUCTOR
repo_name: antonioalcantaramata/CONDUCTOR
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  requirements.txt
# A link to a heading that does not exist fails the strict build, like a missing page.
validation:
  links:
    anchors: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: README.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Choosing a model: guide/choosing-a-model.md
      - Data and the operating point: guide/data-and-operating-point.md
      - Asking questions: guide/asking-questions.md
      - Reading an answer: guide/reading-an-answer.md
      - What-if proposals: guide/what-if-proposals.md
      - The System tab: guide/system-tab.md
      - The advisor: guide/advisor.md
      - Sessions and scenarios: guide/sessions-and-scenarios.md
      - Troubleshooting: guide/troubleshooting.md
  - How it works:
      - methods/index.md
      - Network, data and the operating point: methods/network-and-data.md
      - Power flow and security assessment: methods/power-flow-and-security.md
      - Contingency analysis (N-1): methods/contingency-analysis.md
      - Investigating a cause: methods/investigation.md
      - The optimal power flow: methods/optimal-power-flow.md
      - Corrective options: methods/corrective-options.md
      - Near-optimal alternatives: methods/near-optimal-alternatives.md
      - N-1 security: methods/n1-security.md
      - Studies over time: methods/over-time.md
      - Key performance indicators: methods/key-performance-indicators.md
      - Risk, uncertainty and capacity: methods/risk-and-capacity.md
      - The agent and its checks: methods/the-agent.md
      - Assumptions and limits: methods/assumptions-and-limits.md
  - Research:
      - Using CONDUCTOR in research: research/using-conductor-in-research.md
  - Reference:
      - Tools: reference/tools.md
      - Model options: reference/providers.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        # Diagrams in the "How it works" pages (Material renders them).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Formulas: $ … $ inline, $$ … $$ displayed (as GitHub and editors render them), typeset by MathJax.
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - def_list

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
